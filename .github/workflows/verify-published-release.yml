name: Verify published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        type: string
      source_sha:
        description: Original release source commit
        required: true
        type: string
      release_run_id:
        description: Original release workflow run containing the candidate inventory
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  verify_origin:
    name: Verify published release origin
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Bind the published release to its successful publication and retained candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: node scripts/verify-published-release-origin.mjs "${RELEASE_TAG}" "${RELEASE_SOURCE_SHA}" "${RELEASE_RUN_ID}"

  linux_deb_post_public_smoke:
    name: Linux deb post-public install smoke
    needs: verify_origin
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: batcave-release-candidate-${{ inputs.tag }}
          path: post-public-input
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Verify and exercise the published Linux deb
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/linux-deb-post-public-smoke.mjs "${RELEASE_TAG}" "${RELEASE_SOURCE_SHA}"

      - name: Retain sanitized Linux deb post-public observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batcave-linux-deb-post-public-${{ inputs.tag }}
          path: post-public-output/linux-deb-observation.json
          if-no-files-found: warn
          retention-days: 30

  linux_appimage_post_public_smoke:
    name: Linux AppImage post-public install smoke
    needs: verify_origin
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: batcave-package-release-${{ runner.os }}-${{ runner.arch }}
          workspaces: src/BatCave.App/src-tauri -> target
          cache-workspace-crates: false
          save-if: false

      - run: bash scripts/install-linux-deps.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: batcave-release-candidate-${{ inputs.tag }}
          path: post-public-input
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Build the fixed updater-signature verifier
        run: cargo build --quiet --locked --manifest-path src/BatCave.App/src-tauri/Cargo.toml --bin batcave-verify-updater-signature

      - name: Verify and exercise the published Linux AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/linux-appimage-post-public-smoke.mjs "${RELEASE_TAG}" "${RELEASE_SOURCE_SHA}"

      - name: Retain sanitized Linux AppImage post-public observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batcave-linux-appimage-post-public-${{ inputs.tag }}
          path: post-public-output/linux-appimage-observation.json
          if-no-files-found: warn
          retention-days: 30

  macos_updater_post_public_smoke:
    name: macOS updater post-public staging smoke
    needs: verify_origin
    runs-on: macos-15
    permissions:
      contents: read
      attestations: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: batcave-bundle-release-${{ runner.os }}-${{ runner.arch }}
          workspaces: src/BatCave.App/src-tauri -> target
          cache-workspace-crates: false
          save-if: false

      - name: Verify and stage the exact published macOS updater archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir post-public-output
          observation="post-public-output/macos-updater-observation.json"
          status=0
          cargo run --quiet --locked --manifest-path src/BatCave.App/src-tauri/Cargo.toml --bin batcave-install-smoke --features private-release-verifier -- "${RELEASE_TAG}" macos-updater > "${observation}" || status=$?
          cat "${observation}"
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          node scripts/validate-macos-updater-post-public-observation.mjs "${observation}" "${RELEASE_TAG}" "${RELEASE_SOURCE_SHA}"

      - name: Retain sanitized macOS updater post-public observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batcave-macos-updater-post-public-${{ inputs.tag }}
          path: post-public-output/macos-updater-observation.json
          if-no-files-found: warn
          retention-days: 30
