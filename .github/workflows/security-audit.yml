name: Dependency advisory audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/BatCave.App/package-lock.json

      - run: npm ci
        working-directory: src/BatCave.App

      - name: Audit all frontend dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=moderate --json > npm-audit.json
        working-directory: src/BatCave.App

      - name: Preserve frontend advisory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-advisory-report
          path: src/BatCave.App/npm-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Require a clean frontend audit
        if: steps.audit.outcome != 'success'
        run: exit 1

  rust:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Test the reviewed-warning gate
        run: node --test scripts/validate-cargo-audit-baseline.test.mjs

      - name: Audit Rust dependencies
        id: audit
        continue-on-error: true
        run: cargo audit --json > cargo-audit.json
        working-directory: src/BatCave.App/src-tauri

      - name: Preserve Rust advisory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-advisory-report
          path: src/BatCave.App/src-tauri/cargo-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce the reviewed-warning baseline
        if: always()
        run: node scripts/validate-cargo-audit-baseline.mjs src/BatCave.App/src-tauri/cargo-audit.json .github/security/cargo-audit-baseline.json
